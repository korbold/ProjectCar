services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with local PostgreSQL on 5432
    environment:
      POSTGRES_DB: ibarra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibarra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ibarra.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    profiles:
      - tools

volumes:
  postgres_data:
