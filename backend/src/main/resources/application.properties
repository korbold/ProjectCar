# Database (Docker db service on port 5433 to avoid conflict with local Postgres on 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/ibarra_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (override in prod with env vars)
jwt.secret=ibarra-abastecida-change-me-in-production-use-long-random-string
jwt.expiration-ms=86400000

# Optional: format SQL for debugging
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
